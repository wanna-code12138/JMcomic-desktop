name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src/main/__tests__/*.test.ts | ForEach-Object {
            Write-Host "==> $($_.Name)"
            npx tsx $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Build portable package
        run: npm run package

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-portable
          path: dist-electron/*.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-electron/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found" }
          gh release create "$env:GITHUB_REF_NAME" $exe.FullName --generate-notes
